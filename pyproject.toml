[project]
name = "lcr"
version = "0.1.0"
description = "Injecting Knowledge from a Domain Sentiment Ontology in a Neural Approach for Aspect-Based Sentiment Classification."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "datasets>=2.10.1,<3",
    "matplotlib>=3.10.9,<4",
    "optuna>=4.8.0,<5",
    "rdflib>=6.3.1,<7",
    "requests>=2.33.1,<3",
    "scikit-learn>=1.2.2,<2",
    "torch>=2.11.0,<3",
    "tqdm>=4.65.0,<5",
    "transformers>=4.27.1,<5",
    "ulid>=1.1,<2",
]

[build-system]
requires = ["uv_build>=0.9.14,<0.10.0"]
build-backend = "uv_build"
